[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moescope"
version = "0.1.0"
description = "Expert-parallel serving of Mixture-of-Experts models with per-layer GPU-to-GPU traffic measurement."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mixture-of-experts", "expert-parallelism", "serving", "traffic", "all-to-all", "llm"]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.optional-dependencies]
# 실제 모델 수집·서빙에 필요 (verify-ep / train / tests 는 코어만으로 됨)
model = ["transformers>=4.45", "tokenizers>=0.20", "accelerate>=0.30", "safetensors>=0.4", "joblib>=1.3"]
dev = ["pytest>=7.0"]

[project.scripts]
moescope = "moescope.cli:main"

[tool.setuptools.packages.find]
include = ["moescope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
